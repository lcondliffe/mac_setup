# Hermes (Nous Research): install the upstream CLI (rolling, tracks a git branch;
# not a Homebrew package) and configure one profile per hermes_agents entry.
# No credential in git — see the OAuth gate in tasks/hermes_agent.yml.

- name: Record the hermes binary path
  ansible.builtin.set_fact:
    hermes_bin: "{{ ansible_env.HOME }}/.local/bin/hermes"
  tags: [hermes, upgrade]

- name: Install Hermes agent (upstream install.sh)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
      | bash -s -- --branch {{ hermes_git_branch | quote }}
  args:
    executable: /bin/bash
    creates: "{{ hermes_bin }}"
  when: hermes_install_enabled | bool
  tags: [hermes]

- name: Confirm the hermes binary is present
  ansible.builtin.stat:
    path: "{{ hermes_bin }}"
  register: hermes_stat
  tags: [hermes, upgrade]

- name: Fail if Hermes is missing
  ansible.builtin.fail:
    msg: >-
      Hermes not found at {{ hermes_bin }}. Install it first (set
      hermes_install_enabled: true, or run
      'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash').
  when: not hermes_stat.stat.exists
  tags: [hermes, upgrade]

# Upgrade (opt-in, -t upgrade): `hermes update` pulls latest, reinstalls deps,
# re-syncs skills, migrates config. Gated on --check so it's a no-op when current.
- name: Check whether a Hermes update is available (run explicitly)
  ansible.builtin.command: "{{ hermes_bin }} update --check"
  register: hermes_update_check
  changed_when: false
  failed_when: false
  tags: [never, upgrade]

- name: Upgrade Hermes to the latest release (run explicitly)
  ansible.builtin.command: "{{ hermes_bin }} update --yes"
  when: "'update available' in (hermes_update_check.stdout | default('') | lower)"
  register: hermes_update
  changed_when: true
  tags: [never, upgrade]

- name: Read the installed hermes version
  ansible.builtin.command: "{{ hermes_bin }} --version"
  register: hermes_version_out
  check_mode: false
  changed_when: false
  tags: [hermes, upgrade]

- name: Show the installed hermes version
  ansible.builtin.debug:
    msg: "{{ hermes_version_out.stdout_lines }}"
  tags: [hermes, upgrade]

- name: Configure each Hermes agent
  ansible.builtin.include_tasks: tasks/hermes_agent.yml
  loop: "{{ hermes_agents }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.name }}"
  tags: [hermes]

- name: Read the active hermes profile
  ansible.builtin.command: cat "{{ ansible_env.HOME }}/.hermes/active_profile"  # noqa: command-instead-of-module
  register: hermes_active_profile_final
  check_mode: false
  changed_when: false
  failed_when: false
  tags: [hermes]

- name: Set the machine default hermes profile
  ansible.builtin.command: "{{ hermes_bin }} profile use {{ hermes_default_profile }}"
  when: (hermes_active_profile_final.stdout | default('') | trim) != hermes_default_profile
  changed_when: true
  tags: [hermes]

- name: Show configured hermes profiles
  ansible.builtin.command: "{{ hermes_bin }} profile list"
  register: hermes_profile_list_final
  check_mode: false
  changed_when: false
  tags: [hermes]

- name: Output hermes profiles
  ansible.builtin.debug:
    msg: "{{ hermes_profile_list_final.stdout_lines }}"
  tags: [hermes]
