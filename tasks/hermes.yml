# Hermes (Nous Research): install the upstream CLI and leave it alone.
#
# Deliberately install-only. Persona, model, crons, memories and skills are the
# agent's own state, grown by talking to it — not reconciled from git. An earlier
# version of this file configured all of that declaratively; it fought every
# organic change and is not coming back.
#
# Every task is gated on hermes_install_enabled, so
# -e hermes_install_enabled=false skips the whole component cleanly.

- name: Record the hermes binary path
  ansible.builtin.set_fact:
    hermes_bin: "{{ ansible_facts.env.HOME }}/.local/bin/hermes"
  when: hermes_install_enabled | bool
  tags: [hermes, upgrade]

# Pinned to a release tag: install.sh tracks a rolling branch otherwise, and a
# version jump can migrate the state.db schema without warning. --commit takes
# any rev, so the tag name goes straight through.
- name: Install Hermes agent (upstream install.sh)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/hermes-install.sh
    bash /tmp/hermes-install.sh \
      --branch {{ hermes_git_branch | quote }} \
      --commit {{ hermes_release_tag | quote }} \
      --force-commit
  args:
    executable: /bin/bash
    creates: "{{ hermes_bin }}"
  when: hermes_install_enabled | bool
  tags: [hermes]

- name: Confirm the hermes binary is present
  ansible.builtin.stat:
    path: "{{ hermes_bin }}"
  register: hermes_stat
  when: hermes_install_enabled | bool
  tags: [hermes, upgrade]

- name: Fail if Hermes is missing
  ansible.builtin.fail:
    msg: >-
      Hermes not found at {{ hermes_bin }}. Install it first (set
      hermes_install_enabled: true, or run
      'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash').
  when:
    - hermes_install_enabled | bool
    - not hermes_stat.stat.exists
  tags: [hermes, upgrade]

# The git module clones and checks out; reading the rev of an existing checkout
# is not something it can do. --exact-match so an untagged commit reports empty
# rather than the nearest tag, which would hide the drift.
- name: Read the installed release tag
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: git describe --tags --exact-match HEAD
    chdir: "{{ ansible_facts.env.HOME }}/.hermes/hermes-agent"
  register: hermes_installed_tag
  check_mode: false
  changed_when: false
  failed_when: false
  when: hermes_install_enabled | bool
  tags: [hermes, upgrade]

- name: Warn when the installed release is not the pinned one
  ansible.builtin.debug:
    msg: >-
      Hermes is at {{ hermes_installed_tag.stdout | default('') | ternary(hermes_installed_tag.stdout, 'an untagged commit') }},
      not the pinned {{ hermes_release_tag }}. Re-run with -t upgrade to move it,
      or update hermes_release_tag if the drift is intended.
  when:
    - hermes_install_enabled | bool
    - (hermes_installed_tag.stdout | default('')) != hermes_release_tag
  tags: [hermes, upgrade]

# Opt-in (-t upgrade). Moves the checkout to whatever hermes_release_tag says,
# rather than `hermes update`, which jumps to the head of the rolling branch and
# would defeat the pin. To take a new release: bump the var, then run this.
- name: Move Hermes to the pinned release (run explicitly)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/hermes-install.sh
    bash /tmp/hermes-install.sh \
      --branch {{ hermes_git_branch | quote }} \
      --commit {{ hermes_release_tag | quote }} \
      --force-commit
  args:
    executable: /bin/bash
  register: hermes_update
  changed_when: true
  when:
    - hermes_install_enabled | bool
    - (hermes_installed_tag.stdout | default('')) != hermes_release_tag
  tags: [never, upgrade]

# Crons only fire while the gateway runs, so it needs to survive a logout.
# Hermes installs its own launchd user service; status is the idempotency gate.
- name: Check the gateway status
  ansible.builtin.command: "{{ hermes_bin }} gateway status"
  register: hermes_gateway_status
  check_mode: false
  changed_when: false
  failed_when: false
  when: hermes_install_enabled | bool
  tags: [hermes]

- name: Install and start the gateway on login
  ansible.builtin.command: "{{ hermes_bin }} gateway install --start-now --start-on-login"
  when:
    - hermes_install_enabled | bool
    - "'not running' in (hermes_gateway_status.stdout | default('') | lower)"
  changed_when: true
  tags: [hermes]

- name: Read the installed hermes version
  ansible.builtin.command: "{{ hermes_bin }} --version"
  register: hermes_version_out
  check_mode: false
  changed_when: false
  when: hermes_install_enabled | bool
  tags: [hermes, upgrade]

- name: Show the installed hermes version
  ansible.builtin.debug:
    msg: "{{ hermes_version_out.stdout_lines }}"
    verbosity: 1
  when: hermes_install_enabled | bool
  tags: [hermes, upgrade]
