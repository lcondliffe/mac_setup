# Mack, the on-device agent, lives in its own private repo and runs in a podman
# container: github.com/lcondliffe/mack. This file only puts `mack` on PATH.
#
# A symlink rather than a shell alias: Hermes used to install its own
# ~/.local/bin/mack shim, so the name has to be claimed on PATH to be sure which
# one runs, and a symlink works in scripts and non-interactive shells too.

- name: Check the mack repo is present
  ansible.builtin.stat:
    path: "{{ mack_repo_path }}/bin/mack"
  register: mack_cli
  tags: [mack]

- name: Report a missing mack repo
  ansible.builtin.debug:
    msg: >-
      No mack CLI at {{ mack_repo_path }}/bin/mack — clone
      git@github.com:lcondliffe/mack.git into {{ mack_repo_path }},
      then re-run with -t mack.
  when: not mack_cli.stat.exists
  tags: [mack]

- name: Put mack on PATH
  ansible.builtin.file:
    src: "{{ mack_repo_path }}/bin/mack"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/mack"
    state: link
    force: true
  when: mack_cli.stat.exists
  tags: [mack]
