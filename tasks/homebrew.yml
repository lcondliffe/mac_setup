- name: Ensure Homebrew is installed
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: brew_bin
  tags: [homebrew, packages]

- name: Fail if Homebrew is missing
  ansible.builtin.fail:
    msg: "Homebrew not found at /opt/homebrew/bin/brew. Run ./bootstrap_mac.sh first."
  when: not brew_bin.stat.exists
  tags: [homebrew, packages]

- name: Ensure Homebrew taps
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_taps }}"
  tags: [homebrew, packages, taps]

# Brew silently refuses to load formulae from untrusted taps: the keg stays on
# disk but vanishes from `brew leaves`, so tasks/audit.yml stops seeing it.
- name: Read currently trusted Homebrew taps
  ansible.builtin.command: /opt/homebrew/bin/brew trust --json v1
  register: brew_trust_json
  when: homebrew_trust_taps | bool
  changed_when: false
  tags: [homebrew, packages, taps]

- name: Trust taps declared in vars.yml
  ansible.builtin.command: /opt/homebrew/bin/brew trust --tap {{ item }}
  when: homebrew_trust_taps | bool
  # Official homebrew/* taps are always trusted but never recorded, so trusting
  # them would report changed forever.
  loop: >-
    {{ homebrew_taps
       | reject('match', '^homebrew/') | list
       | difference((brew_trust_json.stdout | default('{}') | from_json).taps | default([])) }}
  changed_when: true
  tags: [homebrew, packages, taps]

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ homebrew_formulae }}"
    state: present
  tags: [homebrew, packages, formulae]

- name: Upgrade Homebrew formulae
  community.general.homebrew:
    name: "{{ homebrew_formulae | difference(homebrew_upgrade_exclude) }}"
    state: latest
  tags: [never, upgrade]

- name: Report formulae excluded from the upgrade
  ansible.builtin.debug:
    msg: "Upgrade these by hand: brew upgrade {{ homebrew_upgrade_exclude | join(' ') }}"
  when: homebrew_upgrade_exclude | length > 0
  tags: [never, upgrade]

# greedy: also move casks whose apps self-update (see homebrew_cask_upgrade_greedy).
- name: Upgrade Homebrew casks (run explicitly)
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: upgraded
    greedy: "{{ homebrew_cask_upgrade_greedy | bool }}"
  loop: "{{ homebrew_casks }}"
  tags: [never, upgrade]

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: true
  loop: "{{ homebrew_casks }}"
  register: cask_install
  failed_when:
    - cask_install.failed
    - "'already installed' not in (cask_install.msg | default(''))"
  tags: [homebrew, packages, casks]

- name: Remove unused Homebrew dependencies (run explicitly)
  ansible.builtin.command: /opt/homebrew/bin/brew autoremove
  register: brew_autoremove_result
  changed_when: "'Autoremoving' in brew_autoremove_result.stdout"
  tags: [never, cleanup]

- name: Clean up Homebrew caches and old versions (run explicitly)
  ansible.builtin.command: /opt/homebrew/bin/brew cleanup --prune=all
  register: brew_cleanup_result
  changed_when: brew_cleanup_result.stdout | length > 0
  tags: [never, cleanup]
