# Configure one `agent`; OAuth credentials remain under ~/.hermes.

- name: List existing hermes profiles
  ansible.builtin.command: "{{ hermes_bin }} profile list"
  register: hermes_profile_list
  check_mode: false
  changed_when: false
  tags: [hermes]

- name: Create hermes profile {{ agent.name }}
  ansible.builtin.command: >-
    {{ hermes_bin }} profile create {{ agent.name }}
    --description "{{ agent.description | default('') }}"
  when: agent.name not in hermes_profile_list.stdout
  changed_when: true
  tags: [hermes]

- name: Read the active hermes profile
  ansible.builtin.command: cat "{{ ansible_env.HOME }}/.hermes/active_profile"  # noqa: command-instead-of-module
  register: hermes_active_profile
  check_mode: false
  changed_when: false
  failed_when: false
  tags: [hermes]

- name: Activate hermes profile {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} profile use {{ agent.name }}"
  when: (hermes_active_profile.stdout | default('') | trim) != agent.name
  changed_when: true
  tags: [hermes]

- name: Read current model settings for {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} config get {{ item }}"
  loop:
    - model.provider
    - model.default
  register: hermes_model_get
  check_mode: false
  changed_when: false
  failed_when: false
  tags: [hermes]

- name: Apply model settings for {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} config set {{ item.key }} {{ item.value }}"
  loop:
    - { key: model.provider, value: "{{ agent.provider }}" }
    - { key: model.default, value: "{{ agent.model }}" }
  loop_control:
    index_var: idx
    label: "{{ item.key }}"
  when: (hermes_model_get.results[idx].stdout | trim) != item.value
  changed_when: true
  tags: [hermes]

- name: Resolve profile path for {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} profile show {{ agent.name }}"
  register: hermes_profile_show
  check_mode: false
  changed_when: false
  tags: [hermes]

- name: Record the profile path for {{ agent.name }}
  ansible.builtin.set_fact:
    hermes_profile_path: "{{ hermes_profile_show.stdout | regex_search('Path:\\s*(\\S+)', '\\1') | first }}"
  tags: [hermes]

- name: Write the managed persona (SOUL.md) for {{ agent.name }}
  ansible.builtin.copy:
    content: "{{ agent.persona }}"
    dest: "{{ hermes_profile_path }}/SOUL.md"
    mode: "0644"
  when: agent.persona is defined
  tags: [hermes]

# --- Scheduled jobs ---
# Reconcile by name; jobs run only while the gateway is active.
# 0700 because hermes chmods this directory to 0700 itself when it writes the
# job store; forcing 0755 here made every rerun report changed.
- name: Ensure the cron directory exists for {{ agent.name }}
  ansible.builtin.file:
    path: "{{ hermes_profile_path }}/cron"
    state: directory
    mode: "0700"
  tags: [hermes]

- name: Read existing scheduled jobs for {{ agent.name }}
  ansible.builtin.slurp:
    src: "{{ hermes_profile_path }}/cron/jobs.json"
  register: hermes_jobs_raw
  failed_when: false
  tags: [hermes]

- name: Compute existing cron jobs for {{ agent.name }}
  ansible.builtin.set_fact:
    hermes_cron_jobs: >-
      {{ (hermes_jobs_raw.content | b64decode | from_json).jobs
         if (hermes_jobs_raw.content is defined) else [] }}
  tags: [hermes]

- name: Compute existing cron names for {{ agent.name }}
  ansible.builtin.set_fact:
    hermes_cron_names: "{{ hermes_cron_jobs | map(attribute='name') | list }}"
    hermes_declared_cron_names: >-
      {{ agent.crons | default([]) | map(attribute='name') | list }}
  tags: [hermes]

- name: Read managed cron names for {{ agent.name }}
  ansible.builtin.slurp:
    src: "{{ hermes_profile_path }}/cron/ansible-managed.json"
  register: hermes_managed_crons_raw
  failed_when: false
  tags: [hermes]

- name: Compute previously managed cron names for {{ agent.name }}
  ansible.builtin.set_fact:
    hermes_previous_managed_cron_names: >-
      {{ (hermes_managed_crons_raw.content | b64decode | from_json).names
         if (hermes_managed_crons_raw.content is defined) else [] }}
  tags: [hermes]

- name: Remove stale managed jobs for {{ agent.name }}
  ansible.builtin.command: >-
    {{ hermes_bin }} cron remove {{ hermes_stale_cron.id | quote }}
  loop: >-
    {{ hermes_previous_managed_cron_names
       | difference(hermes_declared_cron_names)
       | intersect(hermes_cron_names) }}
  loop_control:
    label: "{{ item }}"
  vars:
    hermes_stale_cron: >-
      {{ hermes_cron_jobs | selectattr('name', 'equalto', item) | first }}
  changed_when: true
  tags: [hermes]

- name: Parse declared cron schedules for {{ agent.name }}
  ansible.builtin.command:
    argv:
      - "{{ hermes_python }}"
      - -c
      - >-
        import json, sys; from cron.jobs import parse_schedule;
        print(json.dumps(parse_schedule(sys.argv[1]), sort_keys=True))
      - "{{ item.schedule }}"
  loop: "{{ agent.crons | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: hermes_declared_schedules
  changed_when: false
  when: agent.crons | default([]) | length > 0
  tags: [hermes]

- name: Create scheduled jobs for {{ agent.name }}
  ansible.builtin.command: >-
    {{ hermes_bin }} cron create {{ item.schedule | quote }} {{ item.prompt | quote }}
    --name {{ item.name | quote }}
    --deliver {{ item.deliver | default('local') | quote }}
    {% for skill in item.skills | default([]) %}--skill {{ skill | quote }} {% endfor %}
    {% if item.workdir is defined %}--workdir {{ item.workdir | quote }}{% endif %}
  loop: "{{ agent.crons | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (hermes_cron_names | default([]))
  register: hermes_cron_created
  # `hermes cron create` reports refusals (a missing workdir, say) on stdout
  # and still exits 0, so rc alone would let a silent no-op through.
  failed_when: "'Failed to create job' in (hermes_cron_created.stdout | default(''))"
  changed_when: true
  tags: [hermes]

- name: Update changed scheduled jobs for {{ agent.name }}
  ansible.builtin.command: >-
    {{ hermes_bin }} cron edit {{ hermes_existing_cron.id | quote }}
    --schedule {{ item.schedule | quote }}
    --prompt {{ item.prompt | quote }}
    --name {{ item.name | quote }}
    --deliver {{ item.deliver | default('local') | quote }}
    {% for skill in item.skills | default([]) %}--skill {{ skill | quote }} {% endfor %}
    {% if item.skills | default([]) | length == 0 %}--clear-skills {% endif %}
    --workdir {{ item.workdir | default('') | quote }}
  loop: "{{ agent.crons | default([]) }}"
  loop_control:
    index_var: cron_index
    label: "{{ item.name }}"
  vars:
    hermes_existing_cron: >-
      {{ hermes_cron_jobs | selectattr('name', 'equalto', item.name) | first }}
    hermes_declared_schedule: >-
      {{ hermes_declared_schedules.results[cron_index].stdout | from_json }}
  when:
    - item.name in (hermes_cron_names | default([]))
    - >-
      (hermes_existing_cron.schedule != hermes_declared_schedule)
      or (hermes_existing_cron.prompt != item.prompt)
      or (hermes_existing_cron.deliver != (item.deliver | default('local')))
      or ((hermes_existing_cron.skills | default([])) != (item.skills | default([])))
      or ((hermes_existing_cron.workdir | default('')) != (item.workdir | default('')))
  register: hermes_cron_edited
  failed_when: "'Failed to' in (hermes_cron_edited.stdout | default(''))"
  changed_when: true
  tags: [hermes]

# The cron CLI lacks enabled_toolsets; use its locked update API directly.
- name: Refresh scheduled jobs after reconciliation for {{ agent.name }}
  ansible.builtin.slurp:
    src: "{{ hermes_profile_path }}/cron/jobs.json"
  register: hermes_jobs_reconciled_raw
  when: agent.crons | default([]) | length > 0
  tags: [hermes]

- name: Compute reconciled cron jobs for {{ agent.name }}
  ansible.builtin.set_fact:
    hermes_cron_jobs_reconciled: >-
      {{ (hermes_jobs_reconciled_raw.content | b64decode | from_json).jobs }}
  when: agent.crons | default([]) | length > 0
  tags: [hermes]

- name: Restrict scheduled job toolsets for {{ agent.name }}
  ansible.builtin.command:
    argv:
      - "{{ hermes_python }}"
      - -c
      - >-
        import json, sys; from cron.jobs import update_job;
        update_job(sys.argv[1], {'enabled_toolsets': json.loads(sys.argv[2])})
      - "{{ hermes_reconciled_cron.id }}"
      - "{{ item.enabled_toolsets | default([]) | to_json }}"
  environment:
    HERMES_HOME: "{{ hermes_profile_path }}"
  loop: "{{ agent.crons | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    hermes_reconciled_cron: >-
      {{ hermes_cron_jobs_reconciled | selectattr('name', 'equalto', item.name) | first }}
  when:
    - (hermes_reconciled_cron.enabled_toolsets | default([])) != (item.enabled_toolsets | default([]))
  changed_when: true
  tags: [hermes]

- name: Record managed cron names for {{ agent.name }}
  ansible.builtin.copy:
    content: "{{ {'names': hermes_declared_cron_names} | to_nice_json }}\n"
    dest: "{{ hermes_profile_path }}/cron/ansible-managed.json"
    mode: "0644"
  tags: [hermes]

# --- Scheduler ---
# Per-profile launchd user service; status is the idempotency gate.
- name: Check gateway status for agent {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} gateway status"
  register: hermes_gateway_status
  check_mode: false
  changed_when: false
  failed_when: false
  when: agent.gateway | default(false) | bool
  tags: [hermes]

- name: Install and start the gateway for agent {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} gateway install --start-now --start-on-login"
  when:
    - agent.gateway | default(false) | bool
    - "'not running' in (hermes_gateway_status.stdout | default('') | lower)"
  changed_when: true
  tags: [hermes]

# --- OAuth login gate ---

- name: Check auth status for agent {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} auth status {{ agent.provider }}"
  register: hermes_auth_status
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - hermes_auth_enabled | bool
    - agent.auth | default(false) | bool
  tags: [hermes]

- name: Prompt for OAuth login for agent {{ agent.name }}
  ansible.builtin.pause:
    prompt: |-
      Agent '{{ agent.name }}' needs a one-time OAuth login for provider
      '{{ agent.provider }}' (this uses your subscription; no key is stored in git).

      Type 'login' to open a browser and authenticate now, or press Enter to
      skip and run 'hermes auth add {{ agent.provider }} --type oauth' later.
  register: hermes_auth_answer
  when:
    - hermes_auth_enabled | bool
    - agent.auth | default(false) | bool
    - "'logged out' in (hermes_auth_status.stdout | default('') | lower)"
    - (hermes_auth_action | default('')) == ''
  tags: [hermes]

- name: Resolve auth decision (explicit -e hermes_auth_action wins over the prompt)
  ansible.builtin.set_fact:
    hermes_auth_decision: >-
      {{ (hermes_auth_action | default('') | trim | lower)
         or (hermes_auth_answer.user_input | default('') | trim | lower) }}
  when:
    - hermes_auth_enabled | bool
    - agent.auth | default(false) | bool
    - "'logged out' in (hermes_auth_status.stdout | default('') | lower)"
  tags: [hermes]

- name: Add OAuth credential for agent {{ agent.name }}
  ansible.builtin.command: "{{ hermes_bin }} auth add {{ agent.provider }} --type oauth"
  when:
    - hermes_auth_enabled | bool
    - agent.auth | default(false) | bool
    - "'logged out' in (hermes_auth_status.stdout | default('') | lower)"
    - (hermes_auth_decision | default('')) == 'login'
  changed_when: true
  tags: [hermes]

- name: Note skipped login for agent {{ agent.name }}
  ansible.builtin.debug:
    msg: >-
      {{ agent.provider }} not authenticated. Complete it any time with:
      hermes auth add {{ agent.provider }} --type oauth
  when:
    - hermes_auth_enabled | bool
    - agent.auth | default(false) | bool
    - "'logged out' in (hermes_auth_status.stdout | default('') | lower)"
    - (hermes_auth_decision | default('')) != 'login'
  tags: [hermes]
