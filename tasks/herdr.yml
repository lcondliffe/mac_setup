# herdr config plus agent integrations: per-agent hooks that report lifecycle
# state (working / waiting / idle) back to herdr, so its sidebar and attention
# queue can tell running agents apart.
#
# Each integration installs into that agent's own config directory, which the
# agent itself creates — a Homebrew cask puts Claude/Codex on disk but the
# config directory only appears once the agent has been launched. `herdr
# integration install` exits 1 if it is missing, so each one is gated on its
# `requires` path and skipped until then. Re-run `-t herdr` after first
# launching an agent. Reverse with `herdr integration uninstall <name>`.

- name: Ensure herdr config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/herdr"
    state: directory
    mode: "0755"
  tags: [herdr, agents]

- name: Render herdr config
  ansible.builtin.template:
    src: herdr.config.toml.j2
    dest: "{{ ansible_env.HOME }}/.config/herdr/config.toml"
    mode: "0644"
  register: herdr_config
  tags: [herdr, agents]

- name: Validate herdr config
  ansible.builtin.command: herdr config check
  changed_when: false
  tags: [herdr, agents]

# No-op when no server is running; the config is read at startup either way.
- name: Reload herdr config in the running server
  ansible.builtin.command: herdr server reload-config
  when: herdr_config.changed
  changed_when: true
  failed_when: false
  tags: [herdr, agents]

- name: Check which agent config directories exist
  ansible.builtin.stat:
    path: "{{ item.requires }}"
  loop: "{{ herdr_integrations }}"
  loop_control:
    label: "{{ item.name }}"
  register: herdr_agent_dirs
  changed_when: false
  tags: [herdr, agents]

- name: Read herdr integration status
  ansible.builtin.command: herdr integration status
  register: herdr_integration_status
  check_mode: false
  changed_when: false
  tags: [herdr, agents]

# Status lines read "<name>: current (vN) (<path>)" once installed; anything
# else (not installed / outdated) means it needs the install command.
- name: Install herdr agent integrations
  ansible.builtin.command: "herdr integration install {{ item.item.name }}"
  loop: "{{ herdr_agent_dirs.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    # Quoted: the colon in ': current' would otherwise parse as a YAML mapping.
    - "item.stat.exists"
    - "herdr_integration_status.stdout is not search('^' ~ item.item.name ~ ': current', multiline=True)"
  changed_when: true
  tags: [herdr, agents]

- name: Report agents skipped because they have not been launched yet
  ansible.builtin.debug:
    msg: >-
      herdr integrations skipped (no config directory yet):
      {{ herdr_skipped | join(', ') }}.
      Launch each agent once, then re-run with -t herdr.
  vars:
    herdr_skipped: "{{ herdr_agent_dirs.results | rejectattr('stat.exists') | map(attribute='item.name') | list }}"
  when: herdr_skipped | length > 0
  tags: [herdr, agents]

# Claude's rate-limit figures (5h / 7d windows) are exposed only in the JSON it
# hands its status-line command, so the status line doubles as the reporter that
# pushes them to herdr as a $usage pane token — rendered in the sidebar's
# claude rows. Gated on ~/.claude for the same reason as the integrations above.
- name: Check for the Claude config directory
  ansible.builtin.stat:
    path: "{{ claude_config_dir }}"
  register: claude_config_dir_stat
  changed_when: false
  tags: [herdr, agents]

- name: Render the Claude status line
  ansible.builtin.template:
    src: claude-statusline.py.j2
    dest: "{{ claude_statusline_path }}"
    mode: "0755"
  when: claude_config_dir_stat.stat.exists
  tags: [herdr, agents]

- name: Read Claude settings
  ansible.builtin.slurp:
    src: "{{ claude_settings_path }}"
  register: claude_settings_raw
  when: claude_config_dir_stat.stat.exists
  # Absent until Claude first writes it; the merge below then starts from {}.
  failed_when: false
  changed_when: false
  tags: [herdr, agents]

# Claude and its own integrations own the rest of settings.json (hooks, model,
# plugins), so merge the one key in rather than templating the whole file.
- name: Point Claude's status line at the script
  ansible.builtin.copy:
    content: "{{ claude_settings | combine({'statusLine': claude_statusline_setting}) | to_nice_json }}\n"
    dest: "{{ claude_settings_path }}"
    mode: "0644"
    backup: true
  vars:
    claude_settings: >-
      {{ (claude_settings_raw.content | b64decode | from_json)
         if claude_settings_raw.content is defined else {} }}
  when: claude_config_dir_stat.stat.exists
  tags: [herdr, agents]
