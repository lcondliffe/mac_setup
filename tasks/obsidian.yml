- name: Ensure the Obsidian vault structure exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ obsidian_vault_path }}"
    - "{{ obsidian_vault_path }}/.obsidian"
    - "{{ obsidian_vault_path }}/{{ obsidian_journal_folder }}"
    - "{{ obsidian_vault_path }}/{{ obsidian_templates_folder }}"
  tags: [obsidian]

- name: Install the Obsidian daily journal template
  ansible.builtin.copy:
    src: "obsidian/Daily Journal.md"
    dest: "{{ obsidian_vault_path }}/{{ obsidian_templates_folder }}/Daily Journal.md"
    mode: "0644"
  tags: [obsidian]

- name: Configure Obsidian Daily Notes
  ansible.builtin.copy:
    content: "{{ obsidian_daily_notes_config | to_nice_json }}\n"
    dest: "{{ obsidian_vault_path }}/.obsidian/daily-notes.json"
    mode: "0644"
  tags: [obsidian]

- name: Configure the Obsidian Templates folder
  ansible.builtin.copy:
    content: "{{ {'folder': obsidian_templates_folder} | to_nice_json }}\n"
    dest: "{{ obsidian_vault_path }}/.obsidian/templates.json"
    mode: "0644"
  tags: [obsidian]

- name: Check enabled Obsidian core plugins
  ansible.builtin.stat:
    path: "{{ obsidian_vault_path }}/.obsidian/core-plugins.json"
  register: obsidian_core_plugins_file
  tags: [obsidian]

- name: Read enabled Obsidian core plugins
  ansible.builtin.slurp:
    src: "{{ obsidian_vault_path }}/.obsidian/core-plugins.json"
  register: obsidian_core_plugins_raw
  when: obsidian_core_plugins_file.stat.exists
  tags: [obsidian]

# Obsidian owns this file and has changed its shape: it used to be a list of
# enabled plugin ids, and is now an object keyed by id. Read whichever is there
# and write back the same shape — converting it would fight whichever Obsidian
# version wrote it.
- name: Compute enabled Obsidian core plugins
  ansible.builtin.set_fact:
    obsidian_managed_core_plugins:
      daily-notes: true
      templates: true
    obsidian_core_plugins: >-
      {{ (obsidian_core_plugins_raw.content | b64decode | from_json)
         if obsidian_core_plugins_file.stat.exists else {} }}
  tags: [obsidian]

# Only write when a managed plugin is actually missing: to_nice_json reorders
# and reindents every key Obsidian wrote, so an unconditional copy would report
# changed on every run and churn the file.
- name: Enable Obsidian Daily Notes and Templates
  ansible.builtin.copy:
    content: "{{ obsidian_core_plugins_desired | to_nice_json }}\n"
    dest: "{{ obsidian_vault_path }}/.obsidian/core-plugins.json"
    mode: "0644"
  vars:
    obsidian_core_plugins_desired: >-
      {{ obsidian_core_plugins | combine(obsidian_managed_core_plugins)
         if obsidian_core_plugins is mapping
         else obsidian_core_plugins
              + (obsidian_managed_core_plugins | list | difference(obsidian_core_plugins)) }}
  when: obsidian_core_plugins_desired != obsidian_core_plugins
  tags: [obsidian]
