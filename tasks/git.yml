- name: Configure git user.name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"
  tags: [git]

- name: Configure git user.email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"
  tags: [git]

- name: Configure global git settings
  community.general.git_config:
    name: "{{ item.key }}"
    scope: global
    value: "{{ item.value }}"
  loop: "{{ git_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [git]

- name: Show resulting git config
  ansible.builtin.command: git config --global --list  # noqa: command-instead-of-module
  register: git_global_config
  changed_when: false
  tags: [git]

- name: Output git config
  ansible.builtin.debug:
    msg: "{{ git_global_config.stdout_lines }}"
  tags: [git]
