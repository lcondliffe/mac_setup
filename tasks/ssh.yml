# SSH key gate: an SSH key is a prerequisite for the rest of the setup
# (git over ssh, remote hosts), so every playbook run checks one exists.
# If none is found you're prompted to either generate a fresh ed25519 key
# or abort and import an existing one. Non-interactive runs (no TTY) fall
# through to the abort path with import instructions.
# Bypass entirely with: -e ssh_gate_enabled=false
# Generate without prompting (unattended runs): -e ssh_gate_action=generate

- name: Look for existing SSH private keys
  ansible.builtin.find:
    paths: "{{ ssh_dir }}"
    patterns: "id_ed25519,id_ecdsa,id_rsa"
    hidden: true
  register: ssh_gate_keys
  when: ssh_gate_enabled | bool
  tags: [always, ssh]

- name: Prompt when no SSH key exists
  ansible.builtin.pause:
    prompt: |-
      No SSH private key found in {{ ssh_dir }} (looked for id_ed25519 / id_ecdsa / id_rsa).

      Type 'generate' to create a new ed25519 key at {{ ssh_key_path }} (no passphrase;
      run 'ssh-keygen -p -f {{ ssh_key_path }}' afterwards to add one), or press Enter
      to abort so you can import an existing key
  register: ssh_gate_answer
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
    - (ssh_gate_action | default('')) == ''
  tags: [always, ssh]

- name: Resolve gate decision (explicit -e ssh_gate_action wins over the prompt)
  ansible.builtin.set_fact:
    ssh_gate_decision: >-
      {{ (ssh_gate_action | default('') | trim | lower)
         or (ssh_gate_answer.user_input | default('') | trim | lower) }}
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
  tags: [always, ssh]

- name: Abort until an SSH key is imported
  ansible.builtin.fail:
    msg: >-
      No SSH key present. Import one (copy the private key + .pub into
      {{ ssh_dir }} and chmod 600 the private key), re-run and type
      'generate', or run with -e ssh_gate_action=generate.
      To run without the gate: -e ssh_gate_enabled=false
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
    - (ssh_gate_decision | default('') | trim) != 'generate'
  tags: [always, ssh]

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: "0700"
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
  tags: [always, ssh]

- name: Generate a new ed25519 SSH key
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -C "{{ git_user_email }}" -f "{{ ssh_key_path }}" -N ""
    creates: "{{ ssh_key_path }}"
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
  tags: [always, ssh]

- name: Read the new public key
  ansible.builtin.command: cat "{{ ssh_key_path }}.pub"
  register: ssh_gate_pubkey
  changed_when: false
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
  tags: [always, ssh]

- name: Show the new public key
  ansible.builtin.debug:
    msg:
      - "New SSH key generated. Public key (add it at https://github.com/settings/keys):"
      - "{{ ssh_gate_pubkey.stdout }}"
  when:
    - ssh_gate_enabled | bool
    - ssh_gate_keys.matched == 0
  tags: [always, ssh]
