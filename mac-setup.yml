---
- name: macOS setup
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: SSH key gate (prerequisite check; prompts if no key exists)
      ansible.builtin.include_tasks: tasks/ssh.yml
      tags: [always, ssh]

    - name: Ensure base directories exist in HOME
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ directories }}"
      tags: [dirs]

    - name: Homebrew (taps + formulae + casks)
      ansible.builtin.include_tasks: tasks/homebrew.yml
      tags: [homebrew, packages, taps, formulae, casks, upgrade, cleanup]

    - name: Exported environment variables (managed block in .zshrc)
      ansible.builtin.include_tasks: tasks/env_simple.yml
      tags: [env, shell]

    - name: Shell aliases (managed block in .zshrc)
      ansible.builtin.include_tasks: tasks/aliases.yml
      tags: [aliases, shell]

    - name: Terminal (ghostty config + starship prompt)
      ansible.builtin.include_tasks: tasks/terminal.yml
      tags: [terminal, ghostty, starship, shell]

    - name: Git configuration
      ansible.builtin.include_tasks: tasks/git.yml
      tags: [git]

    - name: pipx packages
      ansible.builtin.include_tasks: tasks/pipx.yml
      tags: [pipx, packages, upgrade]

    - name: Hermes agent (install only; its state is its own)
      ansible.builtin.include_tasks: tasks/hermes.yml
      tags: [hermes]

    - name: herdr config + agent integrations (agent state reporting)
      ansible.builtin.include_tasks: tasks/herdr.yml
      tags: [herdr, agents]

    # After herdr.yml: the guidance it prints is about dictating into herdr.
    - name: Dictation apps (voice input to agents; reports manual setup steps)
      ansible.builtin.include_tasks: tasks/dictation.yml
      tags: [dictation]

    - name: VSCode extensions
      ansible.builtin.include_tasks: tasks/vscode_extensions.yml
      tags: [vscode]

    - name: macOS screenshot keyboard shortcuts
      ansible.builtin.include_tasks: tasks/keyboard_shortcuts.yml
      tags: [keyboard, shortcuts]

    - name: macOS Dock preferences
      ansible.builtin.include_tasks: tasks/dock.yml
      tags: [dock, macos]

    - name: macOS Finder preferences
      ansible.builtin.include_tasks: tasks/finder.yml
      tags: [finder, macos]

    - name: macOS screenshot capture preferences
      ansible.builtin.include_tasks: tasks/screenshots.yml
      tags: [screenshots, macos]

    - name: Touch ID for sudo (requires -K; skip with --skip-tags touchid)
      ansible.builtin.include_tasks: tasks/touchid.yml
      tags: [touchid, macos]

    - name: Drift audit (read-only report; run with -t audit)
      ansible.builtin.include_tasks: tasks/audit.yml
      tags: [never, audit]

    - name: Prune packages not in vars.yml (uninstalls; run -t audit to preview)
      ansible.builtin.include_tasks: tasks/prune.yml
      tags: [never, prune]
