---
- name: macOS setup
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars.yml
    - vars/personal.yml
    - vars/work.yml

  tasks:
    - name: Validate selected setup scopes
      ansible.builtin.assert:
        that:
          - setup_scopes is sequence
          - setup_scopes is not string
          - setup_scopes | difference(['personal', 'work']) | length == 0
        fail_msg: >-
          setup_scopes must be a list containing only 'personal' and/or 'work'.
      tags: [always]

    - name: Assemble common and scoped package lists
      ansible.builtin.set_fact:
        homebrew_taps: >-
          {{ (homebrew_taps
              + (personal_homebrew_taps if 'personal' in setup_scopes else [])
              + (work_homebrew_taps if 'work' in setup_scopes else [])) | unique | list }}
        homebrew_formulae: >-
          {{ (homebrew_formulae
              + (personal_homebrew_formulae if 'personal' in setup_scopes else [])
              + (work_homebrew_formulae if 'work' in setup_scopes else [])) | unique | list }}
        homebrew_casks: >-
          {{ (homebrew_casks
              + (personal_homebrew_casks if 'personal' in setup_scopes else [])
              + (work_homebrew_casks if 'work' in setup_scopes else [])) | unique | list }}
        pipx_packages: >-
          {{ (pipx_packages
              + (personal_pipx_packages if 'personal' in setup_scopes else [])
              + (work_pipx_packages if 'work' in setup_scopes else [])) | unique | list }}
        vscode_extensions: >-
          {{ (vscode_extensions
              + (personal_vscode_extensions if 'personal' in setup_scopes else [])
              + (work_vscode_extensions if 'work' in setup_scopes else [])) | unique | list }}
      tags: [always]

    - name: SSH key gate (prerequisite check; prompts if no key exists)
      ansible.builtin.include_tasks: tasks/ssh.yml
      tags: [always, ssh]

    - name: Ensure base directories exist in HOME
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ directories }}"
      tags: [dirs]

    - name: Homebrew (taps + formulae + casks)
      ansible.builtin.include_tasks: tasks/homebrew.yml
      tags: [homebrew, packages, taps, formulae, casks, upgrade, cleanup]

    - name: Exported environment variables (managed block in .zshrc)
      ansible.builtin.include_tasks: tasks/env_simple.yml
      tags: [env, shell]

    - name: Shell aliases (managed block in .zshrc)
      ansible.builtin.include_tasks: tasks/aliases.yml
      tags: [aliases, shell]

    - name: Git configuration
      ansible.builtin.include_tasks: tasks/git.yml
      tags: [git]

    - name: pipx packages
      ansible.builtin.include_tasks: tasks/pipx.yml
      tags: [pipx, packages, upgrade]

    - name: Kubectl krew
      ansible.builtin.include_tasks: tasks/kubectl.yml
      tags: [kubectl]

    - name: VSCode extensions
      ansible.builtin.include_tasks: tasks/vscode_extensions.yml
      tags: [vscode]

    - name: macOS screenshot keyboard shortcuts
      ansible.builtin.include_tasks: tasks/keyboard_shortcuts.yml
      tags: [keyboard, shortcuts]

    - name: macOS Dock preferences
      ansible.builtin.include_tasks: tasks/dock.yml
      tags: [dock, macos]

    - name: macOS Finder preferences
      ansible.builtin.include_tasks: tasks/finder.yml
      tags: [finder, macos]

    - name: macOS screenshot capture preferences
      ansible.builtin.include_tasks: tasks/screenshots.yml
      tags: [screenshots, macos]

    - name: Touch ID for sudo (requires -K; skip with --skip-tags touchid)
      ansible.builtin.include_tasks: tasks/touchid.yml
      tags: [touchid, macos]

    - name: Drift audit (read-only report; run with -t audit)
      ansible.builtin.include_tasks: tasks/audit.yml
      tags: [never, audit]
