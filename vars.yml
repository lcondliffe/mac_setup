---
# Mac System Environment Variables (non-secret)
env_vars:
  SKIP: "terraform_checkov,end-of-file-fixer"
  PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:$HOME/bin:$HOME/.local/bin:$HOME/.krew/bin:$PATH"

# Git identity (override with -e git_user_email=...)
git_user_name: "Luke Condliffe"
git_user_email: "aero161.luke@gmail.com"

# Global git settings beyond identity (git config --global <key> <value>)
# delta (git-delta, installed via brew above) formats diff/log/show output;
# pager.diff uses --paging=never so `git diff` prints straight to the
# terminal (delta-formatted) instead of opening less.
git_settings:
  credential.helper: osxkeychain
  core.pager: delta
  interactive.diffFilter: delta --color-only
  delta.navigate: "true"
  pager.diff: delta --paging=never
  init.defaultBranch: main
  pull.rebase: "true"
  push.autoSetupRemote: "true"

# Hermes agents (Nous Research): one on-device profile per hermes_agents entry.
# No secrets in git — `auth: true` triggers a one-time OAuth login to
# ~/.hermes/auth.json. gpt-5.6-sol needs the openai-codex provider (not an API key).
# Add an agent = append a list entry (name lowercase/alphanumeric).
hermes_install_enabled: true

# Rolling install tracking a branch (no release tags). Upgrade opt-in via
# `-t upgrade` (runs `hermes update`). hermes_version is a reference label only.
hermes_version: "0.19.0"
hermes_git_branch: main

# OAuth login gate; -e hermes_auth_enabled=false for unattended runs.
hermes_auth_enabled: true

# This machine's sticky-default profile.
hermes_default_profile: mack

hermes_agents:
  - name: mack
    description: "Main personal on-device agent."
    provider: openai-codex
    model: openai/gpt-5.6-sol
    auth: true
    # Per-profile launchd user service (no sudo) running the cron scheduler;
    # starts on login. false = scheduler off, crons stay inert.
    gateway: true
    persona: |
      # Mack

      Managed by Ansible. You are Mack, Luke's main personal agent, running
      on-device on his Mac. You are practical, direct, and proactive.

      ## Daily journal

      Luke's Obsidian daily notes live at
      `~/Documents/Obsidian Vault/Journal/YYYY-MM-DD.md`. After meaningful work
      reaches an outcome, append one concise bullet under `# 📝 Journal`, with
      useful PR, pipeline, issue, or `[[note]]` links. Put new blockers or
      follow-ups under `# ⚠️ Issues Arising`. Do not log routine commands,
      narrate the conversation, duplicate entries, or alter `# 🎯 Plan` unless
      asked. If today's note is missing, create it from
      `Templates/Daily Journal.md` and preserve its structure. Use 🏠 by default;
      change it to 🏢 only when Luke says he is at the office.
    # Scheduled jobs, reconciled by name; fire only when the gateway runs.
    # Optional fields: deliver, skills, workdir, enabled_toolsets.
    crons:
      - name: daily-standup
        schedule: "0 8 * * *"
        deliver: local
        skills:
          - obsidian
        enabled_toolsets:
          - file
          - session_search
        workdir: "{{ obsidian_vault_path }}/{{ obsidian_journal_folder }}"
        prompt: >-
          Draft a concise start-of-day brief with 3-5 prioritised plan
          suggestions. Use only yesterday's single daily note at
          {{ obsidian_vault_path }}/{{ obsidian_journal_folder }}/YYYY-MM-DD.md,
          if it exists, plus Hermes session_search for yesterday's work. Do not
          use terminal, search_files, or inspect any directory. Do not access
          Photos, Media Library, Desktop, Downloads, Application Data, or any
          file outside the Journal folder. Do not look for calendar events
          until a calendar integration is explicitly configured. Return the
          brief only; do not modify the journal.
  # Add more agents here, e.g.:
  # - name: scout
  #   description: "Lightweight research agent."
  #   provider: openrouter
  #   model: openai/gpt-5.6-sol
  #   auth: false

# Daily Notes creates Journal/YYYY-MM-DD.md from the managed template.
obsidian_vault_path: "{{ ansible_env.HOME }}/Documents/Obsidian Vault"
obsidian_journal_folder: Journal
obsidian_templates_folder: Templates
obsidian_daily_notes_config:
  folder: "{{ obsidian_journal_folder }}"
  format: YYYY-MM-DD
  template: "{{ obsidian_templates_folder }}/Daily Journal"

# SSH key gate: refuse to run until an SSH key exists in ssh_dir, offering
# to generate one (see tasks/ssh.yml). Disable with -e ssh_gate_enabled=false
ssh_gate_enabled: true
ssh_dir: "{{ ansible_env.HOME }}/.ssh"
ssh_key_path: "{{ ssh_dir }}/id_ed25519"

# home directory structure
directories:
  - "{{ ansible_env.HOME }}/ansible"
  - "{{ ansible_env.HOME }}/ansible/playbooks"
  - "{{ ansible_env.HOME }}/ansible/roles"
  - "{{ ansible_env.HOME }}/repo"
  - "{{ ansible_env.HOME }}/repo/private"
  - "{{ ansible_env.HOME }}/repo/public"
  - "{{ ansible_env.HOME }}/repo/training"
  - "{{ ansible_env.HOME }}/scripts"
  - "{{ ansible_env.HOME }}/temp"

# Homebrew taps
homebrew_taps:
  - azure/functions
  - fluxcd/tap
  - hashicorp/tap
  - homebrew/services
  - infisical/get-cli
  - lcondliffe/tap
  - siderolabs/tap
  - supabase/tap
  - terraform-linters/tap

# Homebrew formulae (CLI tools)
homebrew_formulae:
  - actionlint
  - ansible
  - ansible-lint
  - azure-cli
  - azure/functions/azure-functions-core-tools@4
  - bash
  - bat                                   # https://github.com/sharkdp/bat
  - curl
  - dockutil                              # https://github.com/kcrawford/dockutil
  - eza                                   # https://github.com/eza-community/eza
  - ffmpeg
  - fzf                                   # https://github.com/junegunn/fzf
  - gh
  - git
  - git-delta                             # https://github.com/dandavison/delta
  - git-filter-repo
  - gitleaks
  - go
  - googleworkspace-cli
  - hashicorp/tap/terraform
  - helm
  - herdr
  - httpie
  - infisical/get-cli/infisical
  - jq
  - krew                                  # kubectl plugin manager
  - kubernetes-cli
  - kubectx
  - lcondliffe/tap/gitling
  - ncdu                                  # https://github.com/rofl0r/ncdu
  - pipx
  - podman
  - podman-compose
  - powershell
  - pre-commit
  - python@3.14
  - sshpass
  - starship                              # https://starship.rs
  - terraform-docs
  - tokei                                 # https://github.com/xampprocky/tokei
  - uv
  - yamllint
  - zsh

# Homebrew casks (GUI apps)
homebrew_casks:
  - claude
  - claude-code@latest                     # stable cask lags; @latest carries new models
  # Remove a stale formula first: brew uninstall --formula codex
  - codex
  - drawio
  - emdash
  - font-jetbrains-mono-nerd-font         # ghostty_font_family (Nerd Font glyphs)
  - gcloud-cli
  - ghostty
  - google-chrome
  - lens
  - maccy
  - microsoft-remote-desktop
  - notion
  - obsidian
  - postman
  - powershell
  - scroll-reverser
  - superwhisper                          # dictation; see tasks/dictation.yml
  - terraform-linters/tap/tflint
  - twingate
  - visual-studio-code
  - zoom

# Terminal stack (see tasks/terminal.yml). Configs live in templates/;
# ghostty themes: `ghostty +list-themes`.
ghostty_theme_dark: "Catppuccin Mocha"
ghostty_theme_light: "Catppuccin Latte"
# Needs the font-jetbrains-mono-nerd-font cask below; without it Ghostty silently
# falls back to its bundled JetBrains Mono (no Nerd Font glyph coverage).
ghostty_font_family: "JetBrainsMono Nerd Font Mono"
ghostty_font_size: 15

# herdr (see tasks/herdr.yml); config template in templates/herdr.config.toml.j2.
# Sidebar ordering: "priority" = attention queue (agents needing input first);
# "spaces" = grouped by workspace.
herdr_agent_panel_sort: priority

# Sidebar colours (Catppuccin Mocha, matching ghostty_theme_dark): agent name in
# blue, the agent's current-task line in near-white so it stays readable.
herdr_agent_fg: "#89b4fa"
herdr_agent_title_fg: "#cdd6f4"

# Sidebar width in columns (stock default 26, stock max 36). Wider so agent
# task lines are readable; prefix+b collapses the sidebar entirely.
herdr_sidebar_width: 40
herdr_sidebar_max_width: 52

# Per-agent state-reporting hooks. Full list: `herdr integration list`.
# `requires` is the agent's own config directory: the agent creates it on first
# launch, and `herdr integration install` fails without it, so tasks/herdr.yml
# skips an integration until its directory exists.
herdr_integrations:
  - name: claude
    requires: "{{ ansible_env.HOME }}/.claude"
  - name: codex
    requires: "{{ ansible_env.HOME }}/.codex"
  - name: hermes
    requires: "{{ ansible_env.HOME }}/.hermes"

# Claude status line (see tasks/herdr.yml): prints the 5h/7d rate-limit figures
# and reports them to herdr as the $usage sidebar token.
claude_config_dir: "{{ ansible_env.HOME }}/.claude"
claude_settings_path: "{{ claude_config_dir }}/settings.json"
claude_statusline_path: "{{ claude_config_dir }}/statusline.py"

# refreshInterval keeps the figures updating while a session sits idle, so the
# reported token does not expire out of the sidebar mid-session.
claude_statusline_setting:
  type: command
  command: "{{ claude_statusline_path }}"
  refreshInterval: 60

# Voice input to the agents (see tasks/dictation.yml). Chosen over Wispr Flow:
# half the price, on-device transcription, JSON modes we could manage later.
dictation_enabled: true

# Opens the Microphone/Accessibility panes for apps not yet set up. Off so an
# unattended run does not throw windows at you.
dictation_open_settings: false

# support_dir is created on first launch, so it doubles as "onboarded" —
# same pattern as herdr_integrations.requires.
dictation_apps:
  - name: superwhisper
    cask: superwhisper
    app_path: "/Applications/superwhisper.app"
    bundle_id: com.superduper.superwhisper
    support_dir: "{{ ansible_env.HOME }}/Library/Application Support/superwhisper"
    notes:
      - "Transcribes on-device; no word cap on the free tier."
      - "Bind to fn — freed by fn_key_usage in tasks/keyboard_shortcuts.yml."
      - "Modes are JSON under ~/superwhisper (cmd+c copies a deep link); could be templated once one is worth keeping."
      - "Keep the modes folder out of iCloud Documents — the app loses track of it."

# pipx packages to install
pipx_packages:
  - jmespath

# vscode extensions to install
vscode_extensions:
  - azurite.azurite
  - eamodio.gitlens                       # GitLens
  - github.github-vscode-theme
  - github.vscode-github-actions
  - hashicorp.terraform                   # HashiCorp Terraform
  - matheusq94.tfs                        # Terraform Format on Save
  - ms-vscode-remote.remote-ssh
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode.powershell                  # PowerShell
  - ms-vscode.remote-explorer
  - pkief.material-icon-theme

# System Settings > Keyboard > "Press 🌐 key to": 0 Do Nothing,
# 1 Change Input Source, 2 Show Emoji & Symbols, 3 Start Dictation.
# 0 frees fn for a dictation hotkey — macOS wins the key otherwise.
fn_key_usage: 0

# macOS screenshot keyboard shortcuts (com.apple.symbolichotkeys)
# Swaps the defaults so the simple combos copy to the clipboard, and the
# file-saving behavior moves to the 4-key combos (nothing is lost).
#   parameters = [asciiCode, virtualKeyCode, modifierMask]
#   modifier masks: Cmd=1048576  Shift=131072  Ctrl=262144  Option=524288
#     Cmd+Shift       = 1179648
#     Cmd+Ctrl+Shift  = 1441792
screenshot_hotkeys:
  - id: 28
    name: "Save full screen to file (Cmd+Ctrl+Shift+3)"
    parameters: [51, 20, 1441792]
  - id: 29
    name: "Copy full screen to clipboard (Cmd+Shift+3)"
    parameters: [51, 20, 1179648]
  - id: 30
    name: "Save selected area to file (Cmd+Ctrl+Shift+4)"
    parameters: [52, 21, 1441792]
  - id: 31
    name: "Copy selected area to clipboard (Cmd+Shift+4)"
    parameters: [52, 21, 1179648]

# macOS Dock preferences (com.apple.dock)
# Native, idempotent defaults applied via community.general.osx_defaults.
dock_defaults:
  - key: show-recents
    type: bool
    value: false
    name: "Hide recent/suggested apps in Dock"

# Declarative Dock layout (applied with dockutil, installed via brew above).
# Apps are pinned in this order; anything else pinned to the Dock (apps or
# folders) is removed. Set dock_manage_layout: false to leave the layout alone.
dock_manage_layout: true
dock_apps:
  - /Applications/Google Chrome.app
  - /Applications/Visual Studio Code.app
  - /Applications/Ghostty.app
  - /Applications/Obsidian.app
  - /Applications/Notion.app
  - /Applications/Claude.app
  - /Applications/Codex.app

# macOS Finder preferences (applied via community.general.osx_defaults)
# domain is per-item because these span NSGlobalDomain, Finder, and desktopservices.
finder_defaults:
  - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: true, name: "Show all file extensions" }
  - { domain: com.apple.finder, key: AppleShowAllFiles, type: bool, value: true, name: "Show hidden files" }
  - { domain: com.apple.finder, key: ShowPathbar, type: bool, value: true, name: "Show path bar" }
  - { domain: com.apple.finder, key: ShowStatusBar, type: bool, value: true, name: "Show status bar" }
  - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: Nlsv, name: "Default to list view" }
  - { domain: com.apple.finder, key: FXDefaultSearchScope, type: string, value: SCcf, name: "Search the current folder by default" }
  - { domain: com.apple.desktopservices, key: DSDontWriteNetworkStores, type: bool, value: true, name: "No .DS_Store on network drives" }

# macOS screenshot capture preferences (com.apple.screencapture)
# Note: this is separate from the screenshot *hotkeys* above (symbolichotkeys).
screenshot_location: "{{ ansible_env.HOME }}/Pictures/Screenshots"
screenshot_defaults:
  - { key: location, type: string, value: "{{ screenshot_location }}", name: "Save screenshots to ~/Pictures/Screenshots" }
  - { key: disable-shadow, type: bool, value: true, name: "Drop the window screenshot shadow" }

# shell aliases
shell_aliases:
  ap: ansible-playbook
  cls: clear
  commit: git add . && git commit -m
  gd: git diff
  git-delete-branches: git branch | grep -v "main" | xargs git branch -D
  gl: git log
  gp: git push
  gpl: git pull
  gst: git status
  k: kubectl
  ll: ls -al
  passgen: tr -dc 'A-Za-z0-9' </dev/urandom | head -c 16 ; echo
  pc: pre-commit run --all-files
  tailscale: /Applications/Tailscale.app/Contents/MacOS/Tailscale
  tfmt: terraform fmt -recursive
