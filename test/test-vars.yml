---
# Minimal package set for `vm_test.sh --minimal`.
# Covers tap/formula/cask paths and tools required by downstream tasks.
# Other values inherit vars.yml because this file is passed as extra vars.

homebrew_taps:
  - lcondliffe/tap

homebrew_formulae:
  - dockutil
  - git-delta
  - herdr
  - jq
  - kubernetes-cli
  - pipx

homebrew_casks:
  - scroll-reverser

# Exercise VSCode's unavailable branch without audit drift.
vscode_extensions: []

# Same reason as dock_apps below: the real list names a cask minimal mode does
# not install, and tasks/dictation.yml fails on a missing app. Empty keeps every
# dictation task running with nothing to find.
dictation_apps: []

pipx_packages:
  - jmespath

# System apps keep Dock testing independent of optional casks.
dock_apps:
  - /Applications/Safari.app
  - /System/Applications/Notes.app
  - /System/Applications/Calendar.app
