---
- name: Resolve VM test expectations
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../vars.yml
  vars:
    managed_agent: >-
      {{ hermes_agents | selectattr('name', 'equalto', hermes_default_profile) | first }}
  tasks:
    - name: Write resolved expectations
      ansible.builtin.copy:
        content: >-
          {{ {
            'profile': hermes_default_profile,
            'crons': managed_agent.crons | default([]),
            'gateway': managed_agent.gateway | default(false) | bool,
            'persona': managed_agent.persona is defined,
            'vault': obsidian_vault_path,
            'journal_folder': obsidian_journal_folder,
            'templates_folder': obsidian_templates_folder
          } | to_nice_json }}
        dest: "{{ resolved_vars_path }}"
        mode: "0600"
      changed_when: false
