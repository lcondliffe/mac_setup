---
- name: Resolve VM test expectations
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../vars.yml
  tasks:
    - name: Write resolved expectations
      ansible.builtin.copy:
        content: >-
          {{ {
            'vault': obsidian_vault_path,
            'journal_folder': obsidian_journal_folder,
            'templates_folder': obsidian_templates_folder
          } | to_nice_json }}
        dest: "{{ resolved_vars_path }}"
        mode: "0600"
      changed_when: false
