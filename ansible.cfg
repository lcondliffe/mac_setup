[defaults]
# Facts are referenced as ansible_facts.env.* throughout; top-level injection
# (ansible_env and friends) is deprecated and off here ahead of the
# ansible-core 2.24 default flip, so any regression fails fast.
inject_facts_as_vars = False

# Most runs are re-runs, so the signal is what changed. Skipped tasks (the
# never-tagged and conditional ones) are noise. Informational output (git config,
# hermes version) sits behind verbosity: 1, so -v shows it.
display_skipped_hosts = False

# Multi-line debug msgs print as readable YAML rather than one escaped blob.
callback_result_format = yaml

# This playbook only ever targets the local machine, so the implicit-localhost
# warnings are expected rather than a misconfiguration.
localhost_warning = False

[inventory]
inventory_unparsed_warning = False
