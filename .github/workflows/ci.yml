---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core and ansible-lint
        run: pip install ansible-core ansible-lint
      - name: Install required collections
        run: ansible-galaxy collection install community.general
      - name: Playbook syntax check
        run: ansible-playbook --syntax-check mac-setup.yml
      - name: ansible-lint
        run: ansible-lint

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
